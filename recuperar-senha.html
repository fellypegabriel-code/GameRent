
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha | GameRent</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="pagina-recuperacao">

        <h1 class="logo-gamerent">GameRent</h1>

        <h2 class="titulo-recuperacao">Recuperar senha</h2>

        <p class="descricao-recuperacao">
            Informe seu e-mail cadastrado para recuperar seu acesso.
        </p>

        <form id="recuperarForm">

            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

            <button type="submit">
                Recuperar senha
            </button>

        </form>

        <p
            id="mensagem"
            role="status"
            aria-live="polite"
        ></p>

        <a href="index.html" class="botao-voltar">
            Voltar para o login
        </a>

    </main>

    <script src="js/recuperar-senha.js"></script>

</body>
</html>
