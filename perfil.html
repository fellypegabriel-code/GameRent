
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | GameRent</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <header class="cabecalho-catalogo">

        <a href="catalogo.html" class="logo-gamerent">
            <i class="bi bi-controller" aria-hidden="true"></i>
            GameRent
        </a>

        <nav aria-label="Navegação principal">
            <a href="catalogo.html">Catálogo</a>
            <a href="meus-alugueis.html">Meus aluguéis</a>
            <a href="perfil.html" aria-current="page">Perfil</a>
            <a href="index.html">Sair</a>
        </nav>

    </header>

    <main class="conteudo-catalogo">

        <section class="introducao-catalogo">
            <h1>Meu Perfil</h1>
            <p>
                Gerencie suas informações pessoais e mantenha sua conta atualizada.
            </p>
        </section>

        <section class="perfil-container">

            <div class="perfil-titulo">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                <h2>Informações da conta</h2>
            </div>

            <form id="perfilForm">

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <h3>Alterar senha</h3>

                <p>
                    Deixe os campos abaixo vazios caso não queira trocar sua senha.
                </p>

                <label for="senha">Nova senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua nova senha"
                    autocomplete="new-password"
                >

                <label for="confirmarSenha">Confirmar nova senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Confirme sua nova senha"
                    autocomplete="new-password"
                >

                <button type="submit">
                    Salvar alterações
                </button>

            </form>

            <p
                id="mensagem"
                role="status"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <script src="js/perfil.js"></script>

</body>
</html>
