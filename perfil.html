<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | GameRent</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <header class="cabecalho-catalogo">
        <h1 class="logo-gamerent"><i class="bi bi-controller"> </i>GameRent</h1>

        <nav>
            <a href="catalogo.html">Catálogo</a>
            <a href="meus-alugueis.html">Meus aluguéis</a>
            <a href="perfil.html">Perfil</a>
            <a href="index.html">Sair</a>
        </nav>
    </header>

    <main class="conteudo-catalogo">

        <section class="introducao-catalogo">
            <h2>Meu Perfil</h2>
            <p>Gerencie suas informações pessoais e mantenha sua conta atualizada.</p>
        </section>

        <section class="perfil-container">

            <div class="perfil-titulo">
                <i class="bi bi-person-circle"></i>
                <h3>Informações da conta</h3>
            </div>

            <form id="perfilForm">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" required>

                <h3>Alterar senha</h3>
                <p>Deixe os campos abaixo vazios caso não queira trocar sua senha.</p>

                <label for="senha">Nova senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua nova senha"
                >

                <label for="confirmarSenha">Confirmar nova senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua nova senha"
                >

                <button type="submit">Salvar alterações</button>

            </form>

            <p id="mensagem"></p>

        </section>

    </main>

    <script src="js/perfil.js"></script>

</body>
</html>
