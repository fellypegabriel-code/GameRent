<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Aluguéis | GameRent</title>

    <link rel="stylesheet" href="css/style.css">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
</head>
<body class="pagina-biblioteca">

    <header class="cabecalho-catalogo">
        <a href="index.html" class="logo-gamerent"> <i class="bi bi-controller"> </i>GameRent</a>

        <nav>
            <a href="index.html">Início</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="meus-alugueis.html">Meus Aluguéis</a>
        </nav>
    </header>

    <main class="conteudo-catalogo">

        <section class="introducao-catalogo">
            <h2>Minha Biblioteca</h2>
            <p>Acompanhe seus jogos alugados e os prazos de utilização.</p>
        </section>

        <div class="filtros-catalogo">
            <input
                type="search"
                id="pesquisaJogo"
                placeholder="Pesquisar jogo..."
            >

            <select id="filtroStatus">
    <option value="todos">Todos os aluguéis</option>
    <option value="ativo">Aluguéis ativos</option>
    <option value="vencido">Aluguéis vencidos</option>
    <option value="cancelado">Aluguéis cancelados</option>
</select>
        </div>

        <div id="mensagem" class="mensagem-catalogo"></div>

        <div id="listaAlugueis" class="grade-jogos">
            <!-- Os jogos serão carregados pelo JavaScript -->
        </div>

    </main>

    <script src="js/meus-alugueis.js"></script>
</body>
</html>
