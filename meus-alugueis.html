
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Aluguéis | GameRent</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>

<body class="pagina-biblioteca">

    <!-- CABEÇALHO -->
    <header class="cabecalho-catalogo">

        <a href="catalogo.html" class="logo-gamerent">
            <i class="bi bi-controller" aria-hidden="true"></i>
            GameRent
        </a>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>

            <a href="catalogo.html">Catálogo</a>

            <a href="meus-alugueis.html" aria-current="page">
                Meus Aluguéis
            </a>

            <a href="perfil.html">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                Perfil
            </a>
        </nav>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo-catalogo">

        <section class="introducao-catalogo">

            <h1>Minha Biblioteca</h1>

            <p>
                Acompanhe seus jogos alugados e os prazos de utilização.
            </p>

        </section>

        <!-- PESQUISA E FILTROS -->
        <section aria-label="Pesquisa e filtros de aluguéis">

            <div class="filtros-catalogo">

                <input
                    type="search"
                    id="pesquisaJogo"
                    name="pesquisaJogo"
                    placeholder="Pesquisar jogo..."
                    aria-label="Pesquisar aluguel pelo nome do jogo"
                    autocomplete="off"
                >

                <select
                    id="filtroStatus"
                    name="filtroStatus"
                    aria-label="Filtrar aluguéis por status"
                >
                    <option value="todos">Todos os aluguéis</option>
                    <option value="ativo">Aluguéis ativos</option>
                    <option value="vencido">Aluguéis vencidos</option>
                    <option value="cancelado">Aluguéis cancelados</option>
                </select>

            </div>

        </section>

        <!-- MENSAGENS -->
        <div
            id="mensagem"
            class="mensagem-catalogo"
            role="status"
            aria-live="polite"
        ></div>

        <!-- LISTA DE ALUGUÉIS -->
        <section aria-label="Lista de jogos alugados">

            <div id="listaAlugueis" class="grade-jogos">
                <!-- Os jogos serão carregados pelo JavaScript -->
            </div>

        </section>

    </main>

    <script src="js/meus-alugueis.js"></script>

</body>
</html>
